data:
  raw_path: data/raw/
  superset_dir: data/processed/superset/  # WS0: featurise materialises; train/evaluate read
  reference_path: data/reference/reference.parquet
  target_col: price_eur_mwh
  date_col: timestamp
  train_end: "2023-12-31"       # everything before this is training data
  val_end:   "2024-06-30"       # validation window
  # test set = everything after val_end
  max_gap_periods: 2            # max consecutive missing periods to impute at temporal.resolution (beyond: dropped)
  fill_method: ffill            # imputation method: ffill | interpolate
  add_is_imputed_flag: true     # add an is_imputed column so downstream can handle imputed rows
  drop_long_gaps: true          # drop rows left as NaN after imputation (explicit policy)
  entsoe:
    bidding_zone: "PL"
    # ENTSO-E served PL day-ahead prices in PLN (not EUR) for delivery days
    # up to 2019-11-19; EUR from 2019-11-20 (verified against the raw XML
    # <currency_Unit.name> tag). entsoe-py does no FX conversion, so rows
    # before the switch would put PLN values into price_eur_mwh. We start at
    # the switch date to keep the stored currency consistent; a follow-up
    # could convert the 2018-01-01..2019-11-19 era via ECB reference rates
    # and move this date back.
    start_date: "2019-11-20"
    include_load: true            # also download actual load and store as load_mw column
    # ENTSO-E API key: single source per runtime — ENTSOE_API_KEY env var
    # for local runs, ENTSOE_API_TOKEN_FILE (Docker secret file) in
    # containers. Exactly one may be set (see _read_api_key).
    allow_synthetic: false        # offline opt-in: substitute synthetic
                                 # price/load when the key is missing
                                 # (D7 policy; never production training)

temporal:
  resolution: hourly            # hourly | daily | weekly
  horizon: 24                   # how many steps ahead to predict
  # horizon=24 at hourly resolution = predict next 24 hours
  # horizon=7  at daily  resolution = predict next week
  # horizon=4  at weekly resolution = predict next month (approx)
  strategy: single_step         # single_step | direct | shared (WS1)
  # single_step = today's behaviour (fit X_t -> y_t), horizon ignored for training
  # direct      = train H separate models, model h predicts y_{t+h}
  # shared      = one model with `horizon_step` as a feature (1..H)

features:
  calendar:
    enabled: true
    include: [hour, day_of_week, month, week_of_year, is_holiday, is_workday,
               days_to_next_holiday, days_since_last_holiday, is_long_weekend]
  weather:
    enabled: true               # materialise-all (WS0): enabled = what the superset contains
    variables: [temperature_2m, wind_speed_100m, shortwave_radiation, cloud_cover,
                precipitation]
    locations: [warsaw, krakow, gdansk, wroclaw]
    allow_synthetic: false      # explicit opt-in: synthetic weather on download failure
                                # (mixed real+synthetic runs are rejected at ingest)
    derivatives:                # WS3: smoothed weather derivatives (EXP-011)
      enabled: false
      variables: [wind_speed_100m]   # subset of weather.variables (validated when enabled)
      order: [1]
      smooth_windows: [3]
  lags:
    enabled: true               # Stage 2: enable lag features
    periods: [1, 2, 3, 24, 48, 168]   # hours (168 = 1 week)
    rolling_windows: [24, 168]  # trailing windows for rolling mean/std
  derivatives:
    enabled: true               # WS0: superset materialises all smoothing windows
    order: [1, 2]              # first and second derivative
    smooth_windows: [3, 6, 12]  # EXP-010 becomes a selection, not a re-featurise
  generation_mix:
    enabled: true               # ENTSO-E generation by source (WS4)
    # No 'nuclear': Poland has no operating nuclear plants, so ENTSO-E
    # returns no matching PSR type and the column would be all-NaN — with
    # data.drop_long_gaps=true that NaN column drops EVERY row at ingest.
    sources: [wind, solar, coal, gas, hydro]
  cross_border_flows:
    enabled: false
    neighbours: [DE_LU, CZ, SK, LT, SE_4]   # ENTSO-E Area codes (typo-checked at load)
  # Real-time publication lag (hours) per raw external column (WS4).
  # The alignment block in build_features replaces each configured raw
  # column with {col}_lag{L}h — the value actually known at prediction
  # time — so training matches the deployed information set (no
  # leakage). Every enabled generation source MUST have an entry here
  # (validated at config load); load_mw has the same ~1h real-time lag.
  availability_lags:
    load_mw: 1
    coal_mw: 1
    gas_mw: 1
    hydro_mw: 1
    solar_mw: 1
    wind_mw: 1
  # The columns THIS run trains on (WS0): {groups: [...], columns: [...]}.
  # Read by train/evaluate only — never triggers ingest or featurise.
  # null = all feature columns in the materialised superset (today's behaviour).
  select: null

model:
  # Stage 2: XGBoost for real model
  type: xgboost.XGBRegressor
  params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

evaluation:
  primary_metric: rmse          # used for model comparison and early stopping
  metrics: [rmse, mae, mape, r2]   # Stage 2: full metrics
  generate_plots: true             # generate actual-vs-predicted and residual plots
  residual_breakdown:           # which categorical variables to break residuals by
    - hour
    - day_of_week
    - month
    - is_holiday                   # added in Stage 2 when real holiday data is available
  residual_quantiles: 5             # WS4: price-quantile residual bins (0 disables)
  sample_week: "2024-03-04"         # WS4: ISO week-start for the sample actual-vs-predicted window
  run_analysis_after_train: true    # WS4: train() runs the shared residual analysis
  naive_period: 168                 # WS7: seasonal-naive lag in native steps (for rmae/mase)
  dm_test: true                     # WS7: Diebold-Mariano significance vs the reference run

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: energy-forecast
  model_name: energy-forecast-model   # registered model name in MLflow registry
  promote_to_production: true   # primary model gets the champion alias; baselines never do
  champion_alias: champion      # alias name for the deployable model
  run_tags: {}                  # extra tags applied to every run (WS6). Convention keys: exp_id (matches the EXPERIMENTS.md heading), series. Reserved keys written by the pipeline are rejected at config load: stage, params_hash, git_commit, manifest_sha256, superset_path, superset_materialisation_hash.

serving:
  port: 8000
  model_alias: champion         # alias of the model registry version to load
  validation:
    max_rows: 1000
    ranges:
      hour: [0, 23]
      day_of_week: [0, 6]
      month: [1, 12]
      week_of_year: [1, 53]
      is_holiday: [0, 1]
      is_workday: [0, 1]

logging:
  level: INFO                   # DEBUG | INFO | WARNING | ERROR
  # file: optional override; default = logs/energy_forecast_pipeline.log (project root)
