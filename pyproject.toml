# =============================================================================
# pyproject.toml — Energy Forecast MLOps
# =============================================================================
# Single source of truth for project metadata, dependencies, and tool config.
#
# Dependency separation:
#   - Production dependencies  → [project].dependencies
#   - Development dependencies → [project.optional-dependencies].dev
#
# Install production only:   pip install .
# Install with dev tools:    pip install -e ".[dev]"
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast-mlops"
version = "0.1.0"
description = "MLOps pipeline for day-ahead electricity price forecasting (Poland, ENTSO-E)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Projekt_MLOps" },
]
keywords = ["mlops", "forecasting", "energy", "fastapi", "mlflow", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# --- Production dependencies ---
# Packages required to run the MLOps pipeline and serve the API in production.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "mlflow>=2.8",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "evidently>=0.4,<0.7",
    "entsoe-py>=0.10",
    "workalendar>=17.0",
    "xgboost>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# --- Development dependencies ---
# Packages required for linting, testing, and CI — not needed in production.
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
# CLI entry points (if needed in the future)
# energy-forecast-train = "src.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# =============================================================================
# Ruff — linter / formatter configuration
# =============================================================================
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# =============================================================================
# Pytest — test configuration
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]

[tool.pytest.ini_options.markers]
unit = "Unit tests (fast, no external services)"
integration = "Integration tests (may require Docker services)"
functional = "Functional / end-to-end tests"

# =============================================================================
# Coverage configuration
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
